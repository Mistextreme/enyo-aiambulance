<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            display: none;
        }

        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        iframe,
        video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div id="video-container">
        <iframe id="ytplayer" style="position:absolute;z-index:98;display:none;" type="text/html" src="" frameborder="0" allowfullscreen></iframe>
        <video id="localPlayer" style="position:absolute;z-index:99;visibility:hidden;"></video>
    </div>

    <script>
        function showUI() {
            document.body.style.display = "flex";
        }

        function hideUI() {
            document.body.style.display = "none";
        }

        function playYouTubeVideo(videoUrl) {
            const iframe      = document.getElementById('ytplayer');
            const localPlayer = document.getElementById('localPlayer'); // FIX: was bare undeclared variable

            // Show YouTube iframe, hide local video player
            iframe.style.display         = 'block';
            localPlayer.style.visibility = 'hidden';

            iframe.src = "https://www.youtube.com/embed/"
                + extractVideoId(videoUrl)
                + "?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0&showinfo=0&enablejsapi=1";

            showUI();

            // YT.Player wraps the iframe to capture onStateChange
            new YT.Player('ytplayer', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                fetch('https://' + GetParentResourceName() + '/videoEnded', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                    body: JSON.stringify({})
                }).then(() => {
                    hideUI();
                });
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(?:youtu.be\/|v\/|\/u\/\w\/|embed\/|watch\?v=|&v=)([^&\n]{11}).*/;
            const match  = url.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        function playLocalVideo(videoPath) {
            const iframe      = document.getElementById('ytplayer');
            const localPlayer = document.getElementById('localPlayer');

            // Hide YouTube iframe, show local video player
            iframe.style.display         = 'none';
            localPlayer.style.visibility = 'visible';
            localPlayer.src              = videoPath;

            localPlayer.onerror = function () {
                hideUI();
            };

            localPlayer.play().then(() => {
                showUI();
            }).catch(() => {
                hideUI();
            });

            localPlayer.onended = notifyVideoEnded;
        }

        function notifyVideoEnded() {
            fetch('https://' + GetParentResourceName() + '/videoEnded', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify({})
            }).then(() => {
                hideUI();
            });
        }

        window.addEventListener('message', function (event) {
            const data = event.data;
            if (data.action === 'playVideo') {
                if (data.videoType === 'youtube') {
                    playYouTubeVideo(data.url);
                } else if (data.videoType === 'local') {
                    playLocalVideo(data.url);
                }
            }
        });

        // Load the YouTube IFrame API once via dynamic script tag
        const tag = document.createElement('script');
        tag.src   = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);
    </script>
</body>

</html>
