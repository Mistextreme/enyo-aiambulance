<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            display: none;
        }
        
        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        
        iframe,
        video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
            /* Maintain aspect ratio */
        }
        
        #video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
    <div id="video-container">
        <iframe id="ytplayer" style="position:absolute;z-index:98" type="text/html" src="" frameborder="0" allowfullscreen></iframe>
        <video id="localPlayer" style="position:absolute;z-index:99" controls></video>
    </div>

    <script>
        let player; // Define player variable globally

        function showUI() {
            document.body.style.display = "flex"; // Show the UI
        }

        function hideUI() {
            document.body.style.display = "none"; // Hide the UI
        }

        function playYouTubeVideo(videoUrl) {
            const iframe = document.getElementById('ytplayer');
            iframe.src = "https://www.youtube.com/embed/" + extractVideoId(videoUrl) + "?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0&showinfo=0&enablejsapi=1";

            // Make the UI visible when the video starts playing
            showUI();
            iframe.style.display = 'block'; // Hide YouTube iframe
            localPlayer.style.visibility = 'hidden'; // Show local video player

            // When the iframe is loaded, listen for the video end event
            const player = new YT.Player('ytplayer', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // This function handles when the video finishes
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                // Notify Lua that the video has ended
                fetch('https://' + GetParentResourceName() + '/videoEnded', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify({})
                }).then(() => {
                    // Hide the NUI when the video ends
                    hideUI();
                });
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*(?:youtu.be\/|v\/|\/u\/\w\/|embed\/|watch\?v=|&v=)([^&\n]{11}).*/;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : null; // Return the video ID
        }

        function playLocalVideo(videoPath) {
            const iframe = document.getElementById('ytplayer');
            const localPlayer = document.getElementById('localPlayer');

            iframe.style.display = 'none'; // Hide YouTube iframe
            localPlayer.style.visibility = 'visible'; // Show local video player
            localPlayer.src = videoPath;

            localPlayer.onerror = function() {
                alert("Error loading the video. Please check the file path.");
                hideUI();
            };

            localPlayer.play().then(() => {
                showUI();
            }).catch(error => {
                alert("Error playing the video.");
                hideUI();
            });

            localPlayer.onended = notifyVideoEnded; // Listen for video end
        }

        function notifyVideoEnded() {
            fetch(`https://${GetParentResourceName()}/videoEnded`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=UTF-8'
                },
                body: JSON.stringify({})
            }).then(() => {
                hideUI();
            });
        }

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.action === 'playVideo') {
                if (data.videoType === 'youtube') {
                    playYouTubeVideo(data.url);
                } else if (data.videoType === 'local') {
                    playLocalVideo(data.url);
                }
            }
        });

        // Load YouTube API script dynamically
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);
    </script>
</body>

</html>
